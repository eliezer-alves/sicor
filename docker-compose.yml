version: "3.8"

services:
  api:
    build:
      context: ./api
    container_name: geoapi-server
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DB_USER: postgres
      DB_PASS: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: geoapi
    restart: unless-stopped

  db:
    image: postgis/postgis:15-3.3
    container_name: postgis-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: geoapi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geoapi"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  importer:
    build:
      context: .
    container_name: geoapi-importer
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: postgres
      DB_PASS: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: geoapi
      INPUT_DIR: /app/input
      SCHEMA_SQL_PATH: /app/schema.sql
      ANALYZE_AFTER_EACH_FILE: "true"
    volumes:
      - ./input:/app/input
      - ./schema.sql:/app/schema.sql:ro
    # Não roda nada por padrão
    command: ["tail", "-f", "/dev/null"]
    restart: "no"

volumes:
  pgdata:
